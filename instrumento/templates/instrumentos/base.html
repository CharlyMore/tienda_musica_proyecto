<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ritmo | Tienda de música{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #29251f;
            --muted: #80796f;
            --paper: #f7f4ed;
            --card: #fffdf9;
            --accent: #bd583d;
            --accent-dark: #91412e;
            --line: #e9e1d5;
            --olive: #65704f;
            --serif: "Playfair Display", Georgia, serif;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            background:
                radial-gradient(ellipse at 8% 8%, #efe7d9 0, transparent 27rem),
                var(--paper);
            color: var(--ink);
            font-family: "DM Sans", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        header {
            position: sticky;
            z-index: 5;
            top: 0;
            border-bottom: 1px solid #ffffff17;
            background: rgba(39, 35, 31, .97);
            color: white;
            padding: 0 24px;
            box-shadow: 0 8px 26px #201a1414;
        }
        .barra, main, footer .pie { width: min(1160px, calc(100% - 48px)); margin: auto; }
        .barra { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .marca { display: inline-flex; align-items: center; gap: 11px; color: white; font-family: var(--serif); font-size: 1.45rem; font-weight: 700; text-decoration: none; letter-spacing: -.04em; }
        .marca-icono { display: grid; width: 39px; height: 39px; place-items: center; border: 1px solid #ffffff35; border-radius: 50%; color: #e6b96f; font-family: sans-serif; font-size: 1.3rem; }
        .nav-derecha { display: flex; align-items: center; gap: 24px; }
        .barra p { color: #c5bdb1; margin: 0; font-size: .88rem; }
        .nav-enlace { color: #f2ede4; font-size: .9rem; text-decoration: none; transition: color .2s; }
        .nav-enlace:hover { color: #e6b96f; }
        .nav-derecha form { margin: 0; }
        .nav-boton { border: 1px solid #ffffff2b; border-radius: 999px; padding: 9px 14px; background: #ffffff0a; font: inherit; cursor: pointer; transition: background .2s, border-color .2s; }
        .nav-boton:hover { border-color: #e6b96f80; background: #ffffff14; }
        main { min-height: calc(100vh - 150px); padding: 48px 0 84px; }
        body:not(.pagina-login) main { animation: aparecer .35s ease-out both; }
        @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        h1, h2, h3 { font-family: var(--serif); }
        h1 { margin: 0 0 11px; font-size: clamp(2rem, 4vw, 3rem); letter-spacing: -.045em; line-height: 1.12; }
        h2 { margin-top: 0; }
        .subtitulo { margin: 0; color: var(--muted); line-height: 1.7; }
        .etiqueta-superior { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 13px; color: var(--accent-dark); font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
        .etiqueta-superior::before { width: 22px; height: 1px; background: currentColor; content: ""; }
        .hero { position: relative; display: grid; grid-template-columns: 1.15fr .85fr; min-height: 340px; overflow: hidden; align-items: center; margin: 0 0 54px; padding: 50px clamp(28px, 6vw, 74px); border-radius: 18px; background: #302923; color: white; isolation: isolate; }
        .hero::before, .hero::after { position: absolute; z-index: -1; border: 1px solid #ffffff12; border-radius: 50%; content: ""; }
        .hero::before { width: 490px; height: 490px; right: 3%; top: -34%; }
        .hero::after { width: 390px; height: 390px; right: 8%; top: -17%; }
        .hero-texto { max-width: 555px; }
        .hero .etiqueta-superior { color: #e2b875; }
        .hero h1 { max-width: 530px; margin-bottom: 16px; font-size: clamp(2.5rem, 5vw, 4rem); }
        .hero h1 span { color: #e6b96f; font-style: italic; }
        .hero .subtitulo { max-width: 450px; color: #d3c9bb; font-size: 1.02rem; }
        .hero-acciones { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 27px; }
        .hero-link { color: #f0dfc4; font-size: .9rem; text-decoration: none; }
        .hero-link:hover { text-decoration: underline; }
        .hero-ilustracion { display: flex; justify-content: center; align-items: center; min-height: 230px; }
        .hero-ilustracion svg { width: min(100%, 295px); height: auto; overflow: visible; filter: drop-shadow(0 22px 26px #100e0b66); transform: rotate(-12deg); }
        .boton {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            padding: 12px 18px;
            font: inherit;
            font-size: .9rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background .2s, transform .2s, box-shadow .2s;
        }
        .boton:focus-visible, .nav-enlace:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 3px solid #bd583d66;
            outline-offset: 3px;
        }
        .boton:hover { background: var(--accent-dark); box-shadow: 0 7px 18px #91412e35; transform: translateY(-1px); }
        .boton-claro { background: #f2c780; color: #302923; }
        .boton-claro:hover { background: #f8d89f; box-shadow: 0 7px 18px #00000025; }
        .boton-secundario { background: #f1eee8; color: var(--ink); }
        .boton-secundario:hover { background: #e8e0d4; box-shadow: none; }
        .boton-peligro { background: #a43e36; }
        .seccion-catalogo { scroll-margin-top: 24px; }
        .encabezado { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 24px; }
        .encabezado h2 { margin: 0 0 5px; font-size: 1.8rem; letter-spacing: -.03em; }
        .contador { display: inline-block; margin-left: 8px; color: var(--muted); font: 500 .9rem "DM Sans", sans-serif; letter-spacing: 0; }
        .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(245px, 1fr)); gap: 20px; }
        .tarjeta, .panel, .vacio {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 12px 34px #382e1c0d;
        }
        .tarjeta { min-width: 0; overflow: hidden; padding: 0; transition: transform .22s, box-shadow .22s; }
        .tarjeta:hover { box-shadow: 0 16px 35px #382e1c16; transform: translateY(-4px); }
        .tarjeta-arte { position: relative; display: grid; height: 164px; overflow: hidden; place-items: center; background: linear-gradient(135deg, #e8dbc4, #f3eadc); }
        .tarjeta:nth-child(4n + 2) .tarjeta-arte { background: linear-gradient(135deg, #d9e0d0, #edf0e7); }
        .tarjeta:nth-child(4n + 3) .tarjeta-arte { background: linear-gradient(135deg, #e7d6d1, #f2e7df); }
        .tarjeta:nth-child(4n + 4) .tarjeta-arte { background: linear-gradient(135deg, #ddd9e8, #eeebf2); }
        .tarjeta-arte::before, .tarjeta-arte::after { position: absolute; width: 220px; height: 220px; border: 1px solid #ffffff99; border-radius: 50%; content: ""; }
        .tarjeta-arte::before { transform: translate(-60px, 75px); }
        .tarjeta-arte::after { width: 165px; height: 165px; transform: translate(-60px, 75px); }
        .instrumento-icono { position: relative; z-index: 1; display: grid; width: 88px; height: 88px; place-items: center; border: 1px solid #ffffffbb; border-radius: 50%; background: #fffaf0a8; color: #573b2d; font-size: 2.75rem; transition: transform .25s; }
        .tarjeta:hover .instrumento-icono { transform: scale(1.08) rotate(-5deg); }
        .tarjeta-contenido { padding: 20px; }
        .categoria { color: var(--muted); margin: 0 0 9px; font-size: .82rem; }
        .tarjeta h3 { overflow: hidden; margin: 0 0 4px; font-size: 1.25rem; text-overflow: ellipsis; white-space: nowrap; }
        .marca-instrumento { margin: 0 0 17px; color: var(--muted); font-size: .88rem; }
        .precio { color: var(--accent-dark); font-size: 1.25rem; font-weight: 700; margin: 0; letter-spacing: -.02em; }
        .precio-stock { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
        .stock { color: var(--olive); font-size: .78rem; font-weight: 700; }
        .stock-agotado { color: var(--accent-dark); }
        .acciones { display: flex; gap: 9px; flex-wrap: wrap; }
        .tarjeta .acciones .boton { flex: 1; padding: 10px 12px; font-size: .82rem; }
        .panel { max-width: 760px; margin: 8px auto 0; padding: clamp(24px, 5vw, 42px); }
        .panel > h1 { margin-bottom: 12px; }
        .panel > .subtitulo { max-width: 590px; margin-bottom: 28px; }
        .campo { margin-bottom: 20px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; font-size: .9rem; }
        input, select, textarea {
            width: 100%;
            border: 1px solid #dcd3c6;
            border-radius: 8px;
            padding: 12px 13px;
            font: inherit;
            background: #fffefa;
            transition: border-color .18s, box-shadow .18s, background .18s;
        }
        input:hover, select:hover, textarea:hover { border-color: #bcae9c; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: white; box-shadow: 0 0 0 4px #bd583d1c; }
        textarea { min-height: 120px; resize: vertical; }
        input::placeholder, textarea::placeholder { color: #a39a8e; }
        .ayuda { color: var(--muted); font-size: .86rem; margin: 6px 0 0; }
        .errorlist { color: #a12626; margin: 8px 0 0; padding: 10px 12px 10px 30px; border: 1px solid #a1262626; border-radius: 8px; background: #fff4f1; font-size: .88rem; }
        .vacio { padding: 64px 28px; border-style: dashed; text-align: center; color: var(--muted); }
        .vacio-icono { display: grid; width: 76px; height: 76px; place-items: center; margin: 0 auto 18px; border-radius: 50%; background: #f1e8d9; color: var(--accent-dark); font-size: 2rem; }
        .vacio h2 { margin-bottom: 8px; color: var(--ink); font-size: 1.6rem; }
        .vacio p { margin: 0 0 21px; }
        .detalle { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; margin: 26px 0; }
        .detalle > div { padding: 16px 12px 16px 0; border-top: 1px solid var(--line); }
        .detalle dt { color: var(--muted); font-size: .82rem; margin-bottom: 6px; }
        .detalle dd { margin: 0; font-weight: 700; }
        .detalle > div:nth-child(3) dd { color: var(--accent-dark); font-size: 1.15rem; }
        .detalle-cabecera { margin: -42px -42px 28px; padding: 34px 42px; border-radius: 14px 14px 0 0; background: linear-gradient(125deg, #e8dbc4, #f5eee2); }
        .detalle-cabecera .categoria { margin-bottom: 8px; }
        .detalle-cabecera h1 { margin: 0; }
        footer { padding: 24px; border-top: 1px solid #ffffff12; background: #27231f; color: #bdb4a8; }
        footer .pie { display: flex; justify-content: space-between; gap: 20px; font-size: .82rem; }
        footer p { margin: 0; }
        .descripcion { white-space: pre-wrap; overflow-wrap: anywhere; }
        .panel > form > .acciones { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); }
        .panel > form > p { line-height: 1.7; }
        .panel > form > .acciones .boton { min-width: 145px; }
        @media (max-width: 700px) {
            .barra, main, footer .pie { width: min(100% - 32px, 560px); }
            .barra { min-height: 66px; }
            .nav-derecha { gap: 12px; }
            .barra p { display: none; }
            main { padding-top: 30px; padding-bottom: 54px; }
            .hero { grid-template-columns: 1fr; min-height: auto; margin-bottom: 38px; padding: 38px 28px 20px; }
            .hero-ilustracion { position: absolute; right: -24px; bottom: -34px; width: 165px; min-height: 0; opacity: .25; }
            .hero-ilustracion svg { width: 100%; }
            .hero h1 { max-width: 400px; font-size: clamp(2.35rem, 11vw, 3.5rem); }
            .hero .subtitulo { max-width: 380px; }
            .encabezado { align-items: start; flex-direction: column; }
            .encabezado > .boton { width: 100%; }
            .detalle { grid-template-columns: 1fr 1fr; }
            .detalle-cabecera { margin: -24px -24px 24px; padding: 26px 24px; }
            .panel > form > .acciones .boton { flex: 1 1 100%; }
            footer .pie { flex-direction: column; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body class="{% block body_class %}{% endblock %}" data-api-token="{{ request.session.api_token|default:'' }}">
    <header>
        <div class="barra">
            <a class="marca" href="{% if user.is_authenticated %}{% url 'instrumentos:lista' %}{% else %}{% url 'instrumentos:login' %}{% endif %}"><span class="marca-icono" aria-hidden="true">♫</span> Ritmo</a>
            <div class="nav-derecha">
                <p>Instrumentos para cada escenario</p>
                {% if user.is_authenticated %}
                    <a class="nav-enlace" href="{% url 'instrumentos:lista' %}#catalogo">Explorar tienda ↓</a>
                    <form method="post" action="{% url 'instrumentos:logout' %}" onsubmit="sessionStorage.removeItem('token')">
                        {% csrf_token %}
                        <button class="nav-enlace nav-boton" type="submit">Cerrar sesión ↗</button>
                    </form>
                {% else %}
                    <a class="nav-enlace" href="{% url 'instrumentos:login' %}">Iniciar sesión ↗</a>
                {% endif %}
            </div>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <div class="pie">
            <p>♫ Ritmo — Tienda de música</p>
            <p>Hecho para quienes viven la música.</p>
        </div>
    </footer>
    <script>
        const apiToken = document.body.dataset.apiToken;
        if (apiToken) {
            sessionStorage.setItem("token", apiToken);
        }
    </script>
</body>
</html>
